[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pantrytrack"
version = "0.1.0"
description = "Open-source stock and food-waste tracker for small restaurants and cafés"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nikolaos Manis" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
]
keywords = ["inventory", "restaurant", "food-waste", "small-business", "sqlite"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]

[project.scripts]
pantrytrack = "pantrytrack.cli:main"

[project.urls]
Homepage = "https://github.com/nikolaosmanhss-png/pantrytrack"
Issues = "https://github.com/nikolaosmanhss-png/pantrytrack/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
